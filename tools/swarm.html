<style>

h1 { font: 800 20px/1 var(--display); margin: 0; letter-spacing: -.01em; }

.seg button { font: 600 13px var(--body); color: var(--muted); background: transparent; border: 0; padding: 7px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.grow { flex: 1; }
.clock { font: 600 22px var(--mono); font-variant-numeric: tabular-nums; }

#graph .band { font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; fill: var(--muted); }
#graph .node rect { stroke-width: 1.5; transition: stroke-width .25s, opacity .4s; }
#graph .node { transition: opacity .6s; cursor: default; }
#graph .node.off { opacity: .16; }
#graph .node.hot rect { stroke-width: 3.5; }
#graph .lbl { font-size: 12px; font-weight: 700; }
#graph .sub { font-size: 9.5px; fill: var(--muted); }

.badge { font: 600 11px var(--mono); color: var(--gold); border: 1px solid var(--gold); border-radius: 999px; padding: 4px 10px; display: none; }
body.public .badge { display: inline-block; }
body.public .score .neg { display: none; }

.banner span { font-size: 13px; color: var(--ink); }

.ev { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--panel2); display: grid; gap: 2px; animation: in .35s ease-out; }

.ev .top { display: flex; gap: 8px; align-items: baseline; font: 11px var(--mono); color: var(--muted); }
.ev .who { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

</head>

</main>

  </div>
  <svg id="tl" data-replay aria-label="timeline"></svg>
  <div class="legend" id="legend"></div>

<script>

       publicBadge: 'Vista pública · sin valores privados ni texto interno', pageN: 'Página completa', reads: 'lo leen', withKey: 'con clave', noKey: 'sin clave', brokerKey: 'clave de broker', config: 'config a mano', snapshot: 'foto', ago: 'hace', live_: 'en vivo',
       data: {'d-me': 'Cuenta /api/me', 'd-value': 'Valor privado', 'd-duels': 'Duelos /api/duels', 'd-books': 'Libros de ofertas', 'd-v20': 'Libro de v20', 'd-feed': 'Feed público', 'd-params': 'duel-params.json', 'd-floors': 'rastro_floors.json', 'd-snap': 'Foto me.json', 'd-decisions': 'decisions.jsonl'},

       play: '▶ Play', pause: '❚❚ Pause', page: 'complete', events: 'events', updated: 'updated', source: 'Single source', lock: 'duel running', stop: 'STOP on',
       bands: {people: 'People', team: "Team 3's Claude agents", sessions: 'Sessions on the bus', hub: 'Bus', bots: 'Python bots (Mac Mini)', data: 'Data they decide with (from the code)', world: 'Game'},
       publicBadge: 'Public view · no private values or internal text', pageN: 'Page complete', reads: 'read by', withKey: 'keyed', noKey: 'keyless', brokerKey: 'broker key', config: 'hand-set config', snapshot: 'snapshot', ago: '', live_: 'live',

/* ---------- nodes and layout ---------- */

}

}
function staleness(d) { if (!d || d.kind === 'config' || d.age_s == null) return ''; const lim = d.kind === 'snapshot' ? 1800 : 600; return d.age_s > lim * 6 ? 'stale' : d.age_s > lim ? 'aging' : ''; }
const ORDER = ['thiago', 'hector', 'member3', 'conductor', 'thiago-air-f8', 'mini-conductor', 'lane-a-venue', 'lane-b-mini', 'lane-c-trades', 'lane-d-ladder', 'lane-v-liveview', 'lane-duel', 'lane-market',
  'bus', 'duel', 'broker', 'dealer-bots', 'announce', 'market-desk', 'rastro-seller', 'lease', 'concierge',
  'd-me', 'd-value', 'd-duels', 'd-books', 'd-v20', 'd-feed', 'd-params', 'd-floors', 'd-snap', 'd-decisions', 'teams', 'dealers', 'rastro', 'bench', 'game'];
function ensureData() { Object.keys(META.data || {}).forEach(id => { ensure(id); nodes.get(id).seen = true; }); }
function ensure(id) { if (id && !nodes.has(id)) nodes.set(id, {id, band: bandOf(id), x: 0, y: 0, last: -1e15, seen: false, g: null}); }

function layout() {

  svg.innerHTML = '';
  const defs = el('defs', {}, svg);
  const f = el('filter', {id: 'glow', x: '-50%', y: '-50%', width: '200%', height: '200%'}, defs);
  el('feGaussianBlur', {stdDeviation: 4, result: 'b'}, f); const mg = el('feMerge', {}, f); el('feMergeNode', {in: 'b'}, mg); el('feMergeNode', {in: 'SourceGraphic'}, mg);

  }));

  });
}
const fit = (s, w) => { const m = Math.floor(w / 6.4); return s.length > m ? s.slice(0, m - 1) + '…' : s; };
function curve(a, b) {

/* ---------- playing events ---------- */
let clockMs = Date.now();
function apply(e, animate) {

  const t = Date.parse(e.ts), a = nodes.get(e.src), b = e.dst && nodes.get(e.dst);

function flash(p) { p.setAttribute('stroke', css('--data')); p.setAttribute('stroke-opacity', .95); p.setAttribute('stroke-dasharray', '0'); clearTimeout(p.tm);
  p.tm = setTimeout(() => { p.setAttribute('stroke', css('--muted')); p.setAttribute('stroke-opacity', .5); p.setAttribute('stroke-dasharray', '2 4'); }, 1400); }
function heat(n) { if (!n.g) return; n.g.classList.add('hot'); n.g.setAttribute('filter', 'url(#glow)'); clearTimeout(n.tm); n.tm = setTimeout(() => { n.g.classList.remove('hot'); n.g.removeAttribute('filter'); }, 1100); }
function pulse(a, b, color, dur = 900) {
  const g = document.getElementById('pulses'); if (!g) return;
  const p = el('path', {d: curve(a, b), fill: 'none', stroke: 'none'}, g), c = el('circle', {r: 4.5, fill: color, filter: 'url(#glow)'}, g);
  const L = p.getTotalLength(), t0 = performance.now();
  (function step(now) { const k = Math.min(1, (now - t0) / dur), pt = p.getPointAtLength(L * (1 - Math.pow(1 - k, 2))); c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y); if (k < 1) requestAnimationFrame(step); else { p.remove(); c.remove(); } })(t0);
}
function ripple(n, color) {
  if (!n) return; const g = document.getElementById('pulses'); if (!g) return;
  const c = el('circle', {cx: n.x, cy: n.y, r: 18, fill: 'none', stroke: color, 'stroke-width': 2}, g), t0 = performance.now();
  (function step(now) { const k = Math.min(1, (now - t0) / 700); c.setAttribute('r', 18 + 22 * k); c.setAttribute('opacity', 1 - k); if (k < 1) requestAnimationFrame(step); else c.remove(); })(t0);
}
function decayEdges() {
  edges.forEach(ed => { if (!ed.path) return; const age = (clockMs - ed.last) / 60000; const op = Math.max(0.035, Math.exp(-age / 25)); ed.path.setAttribute('stroke-opacity', op.toFixed(3)); ed.path.setAttribute('stroke-width', (1 + Math.log2(1 + ed.n)).toFixed(2)); });
  nodes.forEach(n => { if (n.g && n.seen && n.band !== 'data') n.g.style.opacity = (clockMs - n.last) / 60000 > 45 ? 0.45 : 1; });
}
let lastScore = null;
function setScore(s) {
  const f = (v, d = 2) => v == null ? '–' : (+v).toLocaleString(lang === 'es' ? 'es-ES' : 'en-GB', {maximumFractionDigits: d});
  document.getElementById('s-score').textContent = f(s.score);
  document.getElementById('s-rank').textContent = s.rank == null ? '–' : s.rank;
  const neg = document.getElementById('s-neg'); neg.textContent = f(s.neg_points, 1);
  neg.classList.toggle('up', !!(lastScore && s.neg_points > lastScore.neg_points)); lastScore = s;
}
function hms(iso) { return iso.slice(11, 19); }
function addFeed(e) {
  if (META.public && !e.text) return;
  if (DATAKINDS.has(e.kind) && !document.getElementById('reads').checked) return;
  const feed = document.getElementById('feed'), d = document.createElement('div');
  d.className = 'ev' + (e.highlight ? ' hl' : '');
  const who = labelOf(e.src) + (e.dst ? ' → ' + labelOf(e.dst) : '');
  d.innerHTML = `<div class="top"><span>${hms(e.ts)}</span><span class="chip" style="color:${col(e.kind)}">${esc(tr('kinds')[e.kind] || e.kind)}</span><span class="who">${esc(who)}</span></div><div class="txt">${esc(e.text)}</div>${e.why ? `<div class="why">${esc(e.why)}</div>` : ''}`;
  feed.prepend(d); while (feed.children.length > 80) feed.lastChild.remove();
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }
function starTitle(e) {
  const m = (e.highlight || '').match(/\b(LAV|LAT|SAL|MAL|RET|CHA)-\d\d\b/);
  if (m) return `★ ${SETS[m[1]]} ${tr('page')}`;
  if (/^page \d+ complete$/.test(e.highlight || '')) return `★ ${tr('pageN')}`;
  const n = (e.highlight || '').match(/([\d.]+) → ([\d.]+)/);
  if (n) return `★ +${(n[2] - n[1]).toLocaleString(lang === 'es' ? 'es-ES' : 'en-GB', {maximumFractionDigits: 1})} ${tr('negpts')}`;
  return '★ ' + e.highlight;
}
function star(e) {
  const b = document.getElementById('banner');
  document.getElementById('b-title').textContent = starTitle(e);
  document.getElementById('b-text').textContent = `${hms(e.ts)} · ${e.text}`;
  b.classList.add('on'); clearTimeout(b.tm); b.tm = setTimeout(() => b.classList.remove('on'), 7000);
  if (mode === 'replay' && playing) { holdUntil = performance.now() + 2600; }
}

/* ---------- live mode ---------- */
async function poll() {
  try {
    const r = await fetch(q(`/events?since=${next}`)); const d = await r.json();
    const fresh = d.events.sort((a, b) => a.ts.localeCompare(b.ts));
    ALL.push(...fresh); next = d.next;
    if (mode === 'live') fresh.forEach(e => apply(e, Date.now() - Date.parse(e.ts) < 10 * 60000 && started));
    updateDays();
  } catch (err) { /* keep the last picture */ }
  started = true;
}
let started = false;
async function meta() {
  try { const r = await fetch(q('/meta')); META = await r.json(); } catch (e) { return; }
  document.body.classList.toggle('public', !!META.public); ensureData(); if (mode === 'live') { layoutKey = ''; relayoutIfNeeded(); }
  const hb = META.desks || {}, parts = [`${tr('source')}: ${(META.events_file || 'swarm-events.jsonl').replace(/^\/(Users|home)\/[^/]+/, '~')} · ${ALL.length} ${tr('events')}`];
  Object.entries(hb).forEach(([k, v]) => parts.push(`${labelOf(k)}: tick ${v.tick ?? '–'} · ${v.time ? hms(v.time) : '–'}`));
  if (META.duel_lock) parts.push('⚑ ' + tr('lock')); if (META.stop) parts.push('⚑ ' + tr('stop'));
  document.getElementById('foot').innerHTML = parts.map(p => `<div>${esc(p)}</div>`).join('');
}

/* ---------- replay mode ---------- */
let playing = false, rt = 0, rStart = 0, rEnd = 0, ri = 0, lastFrame = 0, holdUntil = 0, DAY = [];
function updateDays() {
  const sel = document.getElementById('day'), days = [...new Set(ALL.map(e => e.ts.slice(0, 10)))].sort();
  if (sel.options.length !== days.length) {
    const cur = sel.value; sel.innerHTML = days.map(d => `<option>${d}</option>`).join('');
    sel.value = cur && days.includes(cur) ? cur : days.reduce((best, d) => ALL.filter(e => e.ts.startsWith(d)).length > ALL.filter(e => e.ts.startsWith(best)).length ? d : best, days[days.length - 1] || '');
  }
}
function loadDay() {
  const d = document.getElementById('day').value; DAY = ALL.filter(e => e.ts.startsWith(d)).sort((a, b) => a.ts.localeCompare(b.ts));
  if (!DAY.length) return;
  const first = DAY.find(e => !DATAKINDS.has(e.kind)) || DAY[0]; rStart = Date.parse(first.ts) - 60000; rEnd = Date.parse(DAY[DAY.length - 1].ts) + 60000;
  drawTimeline(); seek(rStart);
  document.getElementById('stars').innerHTML = DAY.filter(e => e.highlight && e.src !== 'game').map((e, i) =>
    `<button type="button" class="star" data-t="${Date.parse(e.ts)}">${esc(starTitle(e))} · ${hms(e.ts).slice(0, 5)}</button>`).join(' ');
  document.querySelectorAll('#stars button').forEach(b => b.addEventListener('click', () => { seek(+b.dataset.t - 4 * 60000); setPlaying(true); }));
}
function reset() { nodes.clear(); edges.clear(); layoutKey = ''; document.getElementById('feed').innerHTML = ''; lastScore = null; ['s-score', 's-rank', 's-neg'].forEach(i => document.getElementById(i).textContent = '–'); }
function seek(t) {
  reset(); ensureData(); DAY.forEach(e => { if (e.source === 'bus') BUS_SESSIONS.add(e.src); ensure(e.src); ensure(e.dst); }); relayoutIfNeeded();
  nodes.forEach(n => { if (n.band === 'data') return; n.seen = false; n.g && n.g.classList.add('off'); });
  rt = t; ri = 0; while (ri < DAY.length && Date.parse(DAY[ri].ts) <= t) { apply(DAY[ri], false); ri++; }
  DAY.slice(Math.max(0, ri - 25), ri).forEach(e => addFeed(e));
  clockMs = rt; tick();
}
function setPlaying(p) { playing = p; document.getElementById('play').textContent = tr(p ? 'pause' : 'play'); lastFrame = performance.now(); }
function frame(now) {
  if (mode === 'replay' && playing && now > holdUntil) {
    const dt = Math.min(250, now - lastFrame) * +document.getElementById('speed').value;
    rt += dt; while (ri < DAY.length && Date.parse(DAY[ri].ts) <= rt) { apply(DAY[ri], true); ri++; }
    if (rt >= rEnd) setPlaying(false);
    clockMs = rt;
  }
  lastFrame = now;
  if (mode === 'live') clockMs = Date.now();
  tick(); requestAnimationFrame(frame);
}
let lastTick = 0;
function tick() {
  const d = new Date(clockMs); document.getElementById('clock').textContent = d.toLocaleTimeString('es-ES', {hour12: false});
  if (performance.now() - lastTick > 200) { decayEdges(); lastTick = performance.now(); if (mode === 'replay') moveCursor(); }
}
function drawTimeline() {
  const svg = document.getElementById('tl'), W = svg.clientWidth || 1000, H = 56; svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = '';
  const x = t => 8 + (t - rStart) / (rEnd - rStart) * (W - 16), bins = new Array(Math.ceil((W - 16) / 4)).fill(0);
  DAY.forEach(e => { const i = Math.floor((x(Date.parse(e.ts)) - 8) / 4); if (bins[i] != null) bins[i]++; });
  const mx = Math.max(1, ...bins);
  bins.forEach((v, i) => { if (v) el('rect', {x: 8 + i * 4, y: 34 - 26 * Math.sqrt(v / mx), width: 3, height: 26 * Math.sqrt(v / mx), fill: css('--claude'), opacity: .55}, svg); });
  for (let h = Math.ceil(rStart / 3600000) * 3600000; h < rEnd; h += 3600000) { const tx = el('text', {x: x(h), y: 50, 'text-anchor': 'middle'}, svg); tx.textContent = new Date(h).toLocaleTimeString('es-ES', {hour: '2-digit', minute: '2-digit'}); }
  DAY.filter(e => e.highlight && e.src !== 'game').forEach(e => { const xx = x(Date.parse(e.ts)); el('line', {x1: xx, x2: xx, y1: 4, y2: 36, stroke: css('--gold'), 'stroke-width': 2}, svg); const s = el('text', {x: xx, y: 10, 'text-anchor': 'middle', fill: css('--gold')}, svg); s.textContent = '★'; });
  el('line', {id: 'cur', x1: 8, x2: 8, y1: 2, y2: 38, stroke: css('--ink'), 'stroke-width': 2}, svg);
  svg.onclick = ev => { const r = svg.getBoundingClientRect(), k = (ev.clientX - r.left - 8 * r.width / W) / (r.width - 16 * r.width / W); seek(rStart + Math.max(0, Math.min(1, k)) * (rEnd - rStart)); };
}
function moveCursor() { const c = document.getElementById('cur'), svg = document.getElementById('tl'); if (!c) return; const W = svg.viewBox.baseVal.width; const xx = 8 + (rt - rStart) / (rEnd - rStart) * (W - 16); c.setAttribute('x1', xx); c.setAttribute('x2', xx); }

/* ---------- mode, language, legend ---------- */
function setMode(m) {
  mode = m; document.body.classList.toggle('live-only', m === 'live');
  document.getElementById('m-live').setAttribute('aria-pressed', m === 'live'); document.getElementById('m-replay').setAttribute('aria-pressed', m === 'replay');
  setPlaying(false); reset();
  if (m === 'replay') { setTimeout(loadDay, 0); return; }
  ensureData(); const today = ALL.length ? ALL[ALL.length - 1].ts.slice(0, 10) : ''; ALL.filter(e => e.ts.startsWith(today)).forEach(e => apply(e, false));
  ALL.slice(-30).forEach(e => addFeed(e));
}
function paintText() {
  document.querySelectorAll('[data-i]').forEach(n => { const v = tr(n.dataset.i); if (typeof v === 'string') n.textContent = v; });
  document.getElementById('lang').textContent = lang === 'es' ? 'EN' : 'ES'; document.documentElement.lang = lang;
  document.getElementById('legend').innerHTML = ['msg', 'bus', 'decision', 'deal', 'offer', 'match', 'score', 'read'].map(k => `<span><i style="background:${col(k)}"></i>${esc(tr('kinds')[k])}</span>`).join('')
    + `<span>┄ ${esc(tr('bands').data)}</span>`;
  document.getElementById('play').textContent = tr(playing ? 'pause' : 'play'); layoutKey = ''; relayoutIfNeeded();
}
document.getElementById('m-live').onclick = () => setMode('live');
document.getElementById('m-replay').onclick = () => setMode('replay');
document.getElementById('play').onclick = () => { if (rt >= rEnd) seek(rStart); setPlaying(!playing); };
document.getElementById('day').onchange = loadDay;
document.getElementById('lang').onclick = () => { lang = lang === 'es' ? 'en' : 'es'; try { localStorage.setItem('swarm-lang', lang); } catch (e) {} paintText(); };
addEventListener('resize', () => { layoutKey = ''; relayoutIfNeeded(); if (mode === 'replay' && DAY.length) drawTimeline(); });

(async function boot() {
  await poll(); await meta(); paintText(); setMode('live');
  setInterval(poll, 3000); setInterval(meta, 15000); requestAnimationFrame(frame);
})();
</script>
